name: Release

# Runs only on a version tag (git tag v0.1.0 && git push origin v0.1.0) or by
# hand. It makes a DRAFT release, so nothing goes public until a person
# publishes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # creates the draft release and uploads the archives

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Linkz runs on lizardscript, built here from the lizard-script repo,
      # checked out next to it: <workspace>/linkz and <workspace>/lizard-script.
      - uses: actions/checkout@v4
        with:
          path: linkz
      - uses: actions/checkout@v4
        with:
          repository: alejandruxxug/lizard-script
          path: lizard-script
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: lizard-script/go.sum
      - name: Build lizardscript
        working-directory: lizard-script
        run: go build -o "$RUNNER_TEMP/lizardscript" .
      - name: Test (both engines)
        working-directory: linkz
        run: LIZARDSCRIPT="$RUNNER_TEMP/lizardscript" scripts/test.sh
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: linkz
        run: sed -i "s/^let linkz_version = \".*\"$/let linkz_version = \"${GITHUB_REF_NAME#v}\"/" lib/app/version.liz
      - name: Build every system
        working-directory: linkz
        run: LIZARDSCRIPT="$RUNNER_TEMP/lizardscript" scripts/crossbuild.sh dist
      - name: Draft release
        working-directory: linkz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" --draft --title "Linkz $tag" --generate-notes dist/linkz_* dist/checksums.txt
