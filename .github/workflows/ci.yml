name: CI

# Manual only for now: these workflows haven't run yet, and pushes to the
# private repo would spend Actions minutes. To run CI on every push, put
# back:  push:  and  pull_request:  under on:.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Linkz runs on lizardscript, built here from the lizard-script repo,
      # checked out next to it: <workspace>/linkz and <workspace>/lizard-script.
      - uses: actions/checkout@v4
        with:
          path: linkz
      - uses: actions/checkout@v4
        with:
          repository: alejandruxxug/lizard-script
          path: lizard-script
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: lizard-script/go.sum
      - name: Build lizardscript
        working-directory: lizard-script
        run: go build -o "$RUNNER_TEMP/lizardscript" .
      - name: Test (both engines)
        working-directory: linkz
        run: LIZARDSCRIPT="$RUNNER_TEMP/lizardscript" scripts/test.sh
      - name: Parity with the Go host's last outputs
        working-directory: linkz
        run: LIZARDSCRIPT="$RUNNER_TEMP/lizardscript" scripts/parity.sh
      - name: Format and check
        working-directory: linkz
        run: |
          "$RUNNER_TEMP/lizardscript" fmt --check main.liz lib tests tools
          "$RUNNER_TEMP/lizardscript" check main.liz lib tests tools
      - name: Cross build
        working-directory: linkz
        run: LIZARDSCRIPT="$RUNNER_TEMP/lizardscript" scripts/crossbuild.sh "$RUNNER_TEMP/dist"
